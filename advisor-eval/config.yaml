models:
  executor: "gpt-4.1-mini"
  advisor: "gpt-4.1"

run:
  max_steps: 10
  temperature: 0.0
  seed: 42

datasets:
  gsm8k_samples: 200
  hotpotqa_samples: 200

policies:
  active: "model_driven"
  threshold: 0.6          # for self_eval
  fixed_interval: 3       # for fixed_interval
  random_prob: 0.3        # for random_prob

costs:
  gpt-4.1-mini:
    input: 0.0000004      # $0.40 per 1M input tokens
    output: 0.0000016     # $1.60 per 1M output tokens
  gpt-4.1:
    input: 0.000002       # $2.00 per 1M input tokens
    output: 0.000008      # $8.00 per 1M output tokens

cache:
  enabled: false
  directory: ".cache"
