models:
  executor: "gpt-5.4-nano"
  advisor: "gpt-5.4"

run:
  max_steps: 16
  temperature: 0.0
  seed: 42

datasets:
  gsm8k_samples: 200
  hotpotqa_samples: 300
  gaia_samples: 165              # full GAIA validation split
  hotpotqa_fullwiki_samples: 300

gaia:
  dataset_id: "gaia-benchmark/GAIA"
  config_name: "2023_all"
  split: "validation"
  max_tool_calls: 12
  max_advisor_calls: 2    # hard cap advisor escalations per task
  local_file: null

hotpotqa_fullwiki:
  split: "validation"
  level: "hard"
  seed: 42
  stratify: true
  local_file: null
  dataset_id: "hotpot_qa"
  config_name: "fullwiki"
  write_manifest: true
  manifest_dir: null
  max_tool_calls: 12
  max_advisor_calls: 2
  search_limit: 8
  top_k_pages: 3
  extract_chars_per_page: 2500
  total_budget_chars: 12000

policies:
  active: "model_driven"
  threshold: 0.6          # for self_eval
  # failure_or_conf_t0.25 / _t0.5 / _t0.75: failure_based OR (confidence < threshold)
  fixed_interval: 3       # for fixed_interval
  random_prob: 0.3        # for random_prob

costs:
  # Prices from https://developers.openai.com/api/docs/pricing (per token).
  gpt-5.4-nano:
    input: 0.00000020     # $0.20 per 1M input tokens
    output: 0.00000125    # $1.25 per 1M output tokens
  gpt-5.4-mini:
    input: 0.00000075     # $0.75 per 1M input tokens
    output: 0.0000045     # $4.50 per 1M output tokens
  gpt-5.4:
    input: 0.0000025      # $2.50 per 1M input tokens
    output: 0.000015      # $15.00 per 1M output tokens
  # Legacy entries kept for backwards-compatible analysis of older runs.
  gpt-4.1-nano:
    input: 0.0000001
    output: 0.0000004
  gpt-4.1:
    input: 0.000002
    output: 0.000008
  gpt-4.1-mini:
    input: 0.0000004
    output: 0.0000016
  gpt-5.2:
    input: 0.00000175
    output: 0.000014

cache:
  enabled: false
  directory: ".cache"
